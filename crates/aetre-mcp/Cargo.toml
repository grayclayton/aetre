[package]
name = "aetre-mcp"
version = "0.1.0"
edition = "2021"
authors = ["Clayton Gray"]
license.workspace = true
description = "Model Context Protocol (MCP) server for AETRE epistemic triage, Kingman queue governance, and VOI routing"

[dependencies]
aetre-core = { path = "../aetre-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-compact = { version = "=2.0.6", default-features = false, features = ["std"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
sha2 = "0.10.8"
rand = "0.8"
