name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        run: cargo audit

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag aetre:ci .
      - name: Report image size
        run: |
          bytes=$(docker image inspect aetre:ci --format '{{.Size}}')
          echo "aetre:ci is $((bytes / 1048576)) MB uncompressed"

      - name: Start image
        run: docker run --detach --name aetre-ci --env AETRE_HTTP_SERVER_TOKEN=ci-token --publish 8080:8080 aetre:ci
      - name: Test status, authentication, and receipt behavior
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/api/status >/tmp/status.json; then
              break
            fi
            sleep 1
          done
          python3 -c "import json; d=json.load(open('/tmp/status.json')); assert d['tools_count']>0, d; print('status reports', d['tools_count'], 'tools')"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"name":"aetre_system_catalog","arguments":{}}' \
            http://127.0.0.1:8080/api/tool)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --header 'X-AETRE-Server-Token: ci-token' \
            --data '{"name":"aetre_system_catalog","arguments":{}}' \
            http://127.0.0.1:8080/api/tool)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8080/api/verify/arbitrary)" = "404"
      - name: Test MCP over stdio, the way the registry entry runs it
        shell: bash
        run: |
          set -euo pipefail
          REQ='{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          count() { python3 -c "import json,sys; print(len(json.load(open(sys.argv[1]))['result']['tools']))" "$1"; }
          # With no environment set the image must answer MCP on stdio and
          # start no HTTP server: that is how an MCP client runs it.
          echo "$REQ" | docker run --rm --interactive aetre:ci > /tmp/stdio.json
          # The image must agree with itself rather than with a number written here.
          test "$(count /tmp/stdio.json)" = "$(python3 -c "import json; print(json.load(open('/tmp/status.json'))['tools_count'])")"
          # And the layers must partition the surface, which is what --layer promises.
          echo "$REQ" | docker run --rm --interactive aetre:ci --layer=micro > /tmp/stdio-micro.json
          echo "$REQ" | docker run --rm --interactive aetre:ci --layer=macro > /tmp/stdio-macro.json
          python3 - <<'CHECK'
          import json
          total = len(json.load(open('/tmp/stdio.json'))['result']['tools'])
          micro = len(json.load(open('/tmp/stdio-micro.json'))['result']['tools'])
          macro = len(json.load(open('/tmp/stdio-macro.json'))['result']['tools'])
          assert micro + macro == total, (micro, macro, total)
          assert micro > 0 and macro > 0, (micro, macro)
          print(f'{total} tools = {macro} macro + {micro} micro')
          CHECK

      - name: Show container logs on failure
        if: failure()
        run: docker logs aetre-ci
      - name: Stop image
        if: always()
        run: docker rm --force aetre-ci
