name: Release Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build MCP release binary
        run: cargo build --locked --release -p aetre-mcp
      - name: Strip binary
        run: strip target/release/aetre-mcp
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: AETRE MCP ${{ github.ref_name }}
          files: target/release/aetre-mcp

  publish-image:
    # The OCI package the MCP registry entry points at. Built from the same tag
    # as the binary above so server.json never names an image that is not there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the crate version
        id: version
        run: |
          v=$(grep -m1 '^version = ' crates/aetre-mcp/Cargo.toml | cut -d'"' -f2)
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "image tag will be $v"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aetre-mcp:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/aetre-mcp:latest
