name: Release Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build MCP release binary
        run: cargo build --locked --release -p aetre-mcp
      - name: Strip binary
        run: strip target/release/aetre-mcp
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AETRE MCP ${{ github.ref_name }}
          files: target/release/aetre-mcp

  publish-image:
    # The OCI package the MCP registry entry points at. Built from the same tag
    # as the binary above so server.json never names an image that is not there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aetre-mcp:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/aetre-mcp:latest

  publish-registry:
    # Lists the server so clients and directories can find it. Runs after the
    # crate and image exist, because the registry verifies both: the cargo
    # package through an mcp-name token in the crate README, the image through
    # its io.modelcontextprotocol.server.name label.
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz"             | tar xz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
