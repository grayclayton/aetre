name: Publish to MCP Registry

# Separate from the binary release so the listing can be corrected without
# cutting a new version: server.json is metadata, and a typo in it should not
# cost a crate publish.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the publisher
        run: |
          url="https://github.com/modelcontextprotocol/registry/releases/latest/download"
          curl -sSL "$url/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" | tar xz mcp-publisher
      - name: Point server.json at the crate version
        run: python3 scripts/sync-server-json.py

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
